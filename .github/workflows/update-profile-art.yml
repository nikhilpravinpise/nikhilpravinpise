name: Update profile art

# Regenerates the 3D ASCII wordmark and the contribution heatmap from real
# GitHub data, daily plus on every push to main.

"on":
  schedule:
    - cron: "20 5 * * *" # ~05:20 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Render 3D ASCII wordmark
        run: python scripts/make_wordmark_svg.py --out wordmark.svg

      - name: Scrape contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore(profile-art): refresh wordmark + contribution heatmap [skip ci]"
          file_pattern: "wordmark.svg contrib-heatmap.svg data/contributions.json"
